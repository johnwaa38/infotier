services:
  - type: web
    name: infotier-api
    runtime: docker
    plan: free
    dockerfilePath: api-nest/Dockerfile
    dockerContext: api-nest
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: infotier-postgres
          property: connectionString
      - key: WEBHOOK_SECRET
        sync: false
  - type: web
    name: infotier-dashboard
    runtime: static
    plan: free
    staticPublishPath: dashboard/dist
    buildCommand: "cd dashboard && npm ci && npm run build"
    envVars:
      - key: VITE_API_BASE
        sync: false
  - type: web
    name: infotier-docs
    runtime: static
    plan: free
    buildCommand: "echo 'Docs ready'"
    staticPublishPath: docs

databases:
  - name: infotier-postgres
    plan: free
