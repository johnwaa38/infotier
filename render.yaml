services:
  - type: web
    name: infotier-api
    runtime: node
    plan: free
    buildCommand: "cd api-nest && npm ci && npx prisma generate && npm run build"
    startCommand: "cd api-nest && npx prisma migrate deploy && npm start"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_RETURN_URL
        value: https://infotier-dashboard.onrender.com/?verification=complete
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_ORIGIN
        value: https://infotier-dashboard.onrender.com
  - type: web
    name: infotier-dashboard
    runtime: static
    plan: free
    staticPublishPath: dashboard/dist
    buildCommand: "cd dashboard && npm ci && npm run build"
    envVars:
      - key: VITE_API_BASE
        sync: false
  - type: web
    name: infotier-docs
    runtime: static
    plan: free
    buildCommand: "echo 'Docs ready'"
    staticPublishPath: docs
